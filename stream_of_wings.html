<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Stream of Wings</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #0e0d0b;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 680px;
      text-align: center;
    }

    blockquote {
      font-family: 'EB Garamond', Georgia, serif;
      font-size: clamp(1.1rem, 2.5vw, 1.4rem);
      font-style: italic;
      line-height: 1.9;
      color: #d4c9b0;
      letter-spacing: 0.01em;
    }

    .source {
      margin-top: 2.5rem;
      font-family: 'EB Garamond', Georgia, serif;
      font-size: 0.85rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #6b6456;
    }
  </style>
</head>
<body>
  <div class="container">
    <blockquote>
      He shall deliver you from the snare of the hunter.<br>
      He shall cover you with his pinions,<br>
      and you shall find refuge under his wings;<br>
      his faithfulness shall be a shield and buckler.<br>
      You shall not be afraid of any terror by night,<br>
      nor of the arrow that flies by day.
    </blockquote>
    <p class="source">Psalm 91 &mdash; Qui Habitat</p>
  </div>
</body>
</html>
